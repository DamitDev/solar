name: Publish Host

# Manual: publish solar-host to PyPI (trusted publisher, environment: release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to PyPI (e.g. v1.2.3)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    # Linux only: the version rewrite uses GNU sed and the publish action runs
    # as a linux/amd64 container. The default labels keep the job off the macOS
    # runner, whose plain `self-hosted` label would otherwise accept it.
    runs-on: [self-hosted, linux]
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set version
        run: sed -i "s/^version = .*/version = \"${INPUT_VERSION#v}\"/" apps/solar-host/pyproject.toml
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Build package
        working-directory: apps/solar-host
        run: uv build
      - name: Pull fresh publish action image
        run: docker pull ghcr.io/pypa/gh-action-pypi-publish:release-v1
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/solar-host/dist/
