name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: download-model/requirements.txt
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff -r download-model/requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Lint and format check
        run: python -m ruff check download-model && python -m ruff format --check download-model
      - name: Build step image
        run: docker build -t supernova-step-download-model:ci download-model/
