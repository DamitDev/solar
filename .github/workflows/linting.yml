# GitHub Actions Workflow for Code Linting
# This workflow checks Python code quality and catches common issues with Ruff

name: Code Linting Check

# WHEN to run this workflow
on:
  push:
    branches: [ main, master ]  # Run when code is pushed to main/master
  pull_request:
    branches: [ main, master ]  # Run when someone opens a PR to main/master

# WHAT to run
jobs:
  ruff-lint-check:
    runs-on: self-hosted
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # Match your Python version
        
    # Step 3: Install Ruff
    - name: Install Ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        
    # Step 4: Run Ruff linting
    - name: Lint with Ruff
      run: |
        ruff check .

