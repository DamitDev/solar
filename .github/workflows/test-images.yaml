name: Build test images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Harbor tag for the test images (recommended: test-<branch>-<identifier>)'
        required: true
        default: 'test-latest'
        type: string
      components:
        description: >-
          Space/comma separated components and/or presets to build.
          Presets: all, core, steps. Components: solar-control, solar-webui,
          data-repository, download-model, download-dataset, upload-model.
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

env:
  REGISTRY: imgrepo.damit.hu
  MANIFEST: .github/release-manifest.json

jobs:
  prepare:
    runs-on: [self-hosted, fast]
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate test tag and resolve components
        id: select
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail

          case "$IMAGE_TAG" in
            test-*) ;;
            *)
              echo "::error::Test image tags must start with 'test-'"
              exit 1
              ;;
          esac

          tokens=$(printf '%s' "$COMPONENTS" | tr ',\n' '  ')
          selected=()
          for tok in $tokens; do
            [ -z "$tok" ] && continue
            if jq -e --arg k "$tok" '.presets[$k]' "$MANIFEST" >/dev/null; then
              while IFS= read -r c; do selected+=("$c"); done \
                < <(jq -r --arg k "$tok" '.presets[$k][]' "$MANIFEST")
            elif jq -e --arg k "$tok" '.components[$k]' "$MANIFEST" >/dev/null; then
              selected+=("$tok")
            else
              echo "::error::Unknown component or preset: '$tok'"
              exit 1
            fi
          done

          if [ ${#selected[@]} -eq 0 ]; then
            echo "::error::No components selected"
            exit 1
          fi

          names_json=$(printf '%s\n' "${selected[@]}" | awk '!seen[$0]++' | jq -R . | jq -s -c .)

          matrix=$(jq -c --argjson names "$names_json" '
            {include: [
              $names[] as $n | {
                name: $n,
                image: .components[$n].image,
                registry_ns: (.components[$n].registry_ns // "imgrepo.damit.hu/aiops"),
                secret_scope: (.components[$n].secret_scope // "AIOPS"),
                context: .components[$n].context,
                dockerfile: .components[$n].dockerfile,
                app_version: (.components[$n].app_version // false)
              }
            ]}
          ' "$MANIFEST")

          echo "Building test images with tag '$IMAGE_TAG': $(echo "$names_json" | jq -r 'join(", ")')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: [self-hosted, fast]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Compute APP_VERSION
        if: matrix.app_version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Harbor tags may be free-form (test-*), but Python packages that receive
          # APP_VERSION (solar-control, solar-webui, data-repository) require PEP 440.
          # Map e.g. test-operator-1 -> 0.0.0+test.operator.1
          raw="${IMAGE_TAG#v}"
          local_label=$(
            printf '%s' "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/./g; s/^\.+//; s/\.+$//'
          )
          if [ -z "$local_label" ]; then
            echo "::error::Could not derive a PEP 440 local version from image tag '$IMAGE_TAG'"
            exit 1
          fi
          APP_VERSION="0.0.0+${local_label}"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=${APP_VERSION} (image tag ${IMAGE_TAG})"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.registry_ns }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
      - uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets[format('{0}_HARBOR_USERNAME', matrix.secret_scope)] }}
          password: ${{ secrets[format('{0}_HARBOR_PASSWORD', matrix.secret_scope)] }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.app_version && format('APP_VERSION={0}', env.APP_VERSION) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
