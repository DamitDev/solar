name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: [self-hosted, fast]
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed apps
        id: changed
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1 -q
            CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" || true)
          else
            BASE="${GITHUB_EVENT_BEFORE:-HEAD~1}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BASE...HEAD" || true)
          fi

          APPS=""
          ALL=0
          for f in $CHANGED; do
            case "$f" in
              apps/solar-control/*)   APPS="$APPS solar-control";;
              apps/solar-host/*)      APPS="$APPS solar-host";;
              apps/solar-webui/*)     APPS="$APPS solar-webui";;
              apps/data-repository/*) APPS="$APPS data-repository";;
              apps/supernova-steps/*) APPS="$APPS supernova-steps";;
              # training-platform-project is docs-only: no checks.
              .github/*|pyproject.toml|uv.lock|pnpm-lock.yaml|pnpm-workspace.yaml|package.json|Makefile|.mise.toml|.pre-commit-config.yaml)
                ALL=1;;
            esac
          done
          if [ "$ALL" = "1" ]; then
            APPS=" solar-control solar-host solar-webui data-repository supernova-steps"
          fi

          # Dedupe + drop empties in one awk pass. NOTE: never pipe through
          # `grep -v '^$'` here — with empty input grep exits 1 and, under
          # `set -o pipefail`, kills the step (hit on no-op commits).
          APPS=$(printf '%s' "$APPS" | tr ' ' '\n' | awk '!seen[$0]++ && NF' | paste -sd ' ' -)
          echo "changed apps: ${APPS:-none}"
          # --arg form always emits a valid JSON array ([] for empty input);
          # piping through `jq -R` reads zero lines for empty input and prints
          # nothing, which would leave the matrix output unparseable.
          JSON=$(jq -nc --arg s "$APPS" '$s | split(" ") | map(select(length > 0))')
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$APPS" | wc -w)" >> "$GITHUB_OUTPUT"

  quality:
    needs: detect
    if: needs.detect.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    uses: ./.github/workflows/quality-gates.yaml
    with:
      app: ${{ matrix.app }}
