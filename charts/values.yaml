# Default values for solar-control v3 (stateless multi-replica)

replicaCount: 2

image:
  repository: imgrepo.damit.hu/aiops/solar-control
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

strategy:
  type: RollingUpdate

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    # Sticky sessions for Socket.IO (recommended but not required with Redis adapter)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "solar-sticky"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: ""
  tls: []

env:
  TZ: "Europe/Budapest"
  HOST: "0.0.0.0"
  PORT: "80"
  LOG_LEVEL: "INFO"

secret:
  existingSecret: ""
  keys:
    - MANAGEMENT_API_KEY

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

probes:
  readiness:
    enabled: true
    path: /ready
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 15
  liveness:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 30

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: solar
    password: solar
    database: solar_gateway
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

nodeSelector: {}
tolerations: []
affinity: {}
