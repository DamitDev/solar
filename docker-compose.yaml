services:
  data-repository:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datarepo
      POSTGRES_PASSWORD: datarepo
      POSTGRES_DB: data_repository
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datarepo -d data_repository"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
