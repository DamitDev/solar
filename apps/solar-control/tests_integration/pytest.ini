[pytest]
testpaths = .
asyncio_mode = auto
# One session-wide event loop for tests AND async fixtures. Without this,
# function-scoped async fixtures (httpx clients) tear down on an already
# closed loop ("Event loop is closed"), and module-scoped fixtures get
# re-created per test.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
# Blast-radius cap, not a budget. The longest legitimate wait is a 180s
# wait_intent_ready (cold start, log-gated) and a few tests chain two of
# them plus setup; 420s clears that with room and still bounds a wedged
# stack to minutes instead of the 28 the suite once burned.
timeout = 420
markers =
    repo_path: minimal repo path (Data Repository -> resolve -> pull -> inference)
    intent_path: full declarative intent path (S-040/S-041/S-042)
    migration_path: S-037 instance migration behavior
    infrastructure: WS seam, gateway registry, model cache, reconciler wake
log_cli = false
