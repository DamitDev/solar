[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-control"
version = "0.0.0-dev"
description = "Stateless coordinator for solar-host instances with multi-tenant OpenAI-compatible API gateway"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "python-socketio[asyncio_server]==5.16.4",
    "redis[hiredis]==8.1.0",
]

[project.optional-dependencies]
integration = [
    "testcontainers[postgres,redis]>=4.15.0",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    # Pinned: ruff 0.16 changed the default rule set and flags the codebase's
    # existing style (248 errors). Bumping this is a deliberate lint cleanup PR.
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
