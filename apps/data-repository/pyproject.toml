[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-repository"
version = "0.0.0.dev0"
description = "API for managing model and dataset registry metadata"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "asyncpg==0.31.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "harbor-oci-client==0.1.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.sql", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"
