# GitHub Actions Workflow for Running Unit Tests
# This file tells GitHub when and how to run your tests automatically

name: Run Unit Tests

# WHEN to run this workflow
on:
  push:
    branches: [ main, master ]  # Run when code is pushed to main/master
  pull_request:
    branches: [ main, master ]  # Run when someone opens a PR to main/master

# WHAT to run
jobs:
  test:
    runs-on: self-hosted
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # Match your Python version
        
    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        
    # Step 4: Run the tests with coverage
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=modules --cov-report=term-missing --cov-report=html
        
    # Step 5: Upload coverage report as artifact (optional - you can download and view it)
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
