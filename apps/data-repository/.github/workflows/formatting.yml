# GitHub Actions Workflow for Code Formatting Checks
# This workflow checks that all Python files are formatted with Black

name: Code Formatting Check

# WHEN to run this workflow
on:
  push:
    branches: [ main, master ]  # Run when code is pushed to main/master
  pull_request:
    branches: [ main, master ]  # Run when someone opens a PR to main/master

# WHAT to run
jobs:
  black-format-check:
    runs-on: self-hosted
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # Match your Python version
        
    # Step 3: Install Black
    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black
        
    # Step 4: Run Black in check mode
    - name: Check formatting with Black
      run: |
        black --check --diff --color .

