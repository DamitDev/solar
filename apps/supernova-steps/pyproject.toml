[project]
name = "supernova-steps"
version = "0.1.0"
description = "SuperNova training pipeline step Docker images"
requires-python = ">=3.12"

[dependency-groups]
# Runtime deps mirror the per-step requirements.txt (Docker build source of
# truth); this group only exists so lint/test can run from a uv venv.
dev = [
    "harbor-oci-client>=0.1.0",
    "requests>=2.32.0",
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.15",
]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "download-model/tests",
    "download-dataset/tests",
    "upload-model/tests",
]
