[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-host"
version = "0.0.0.dev"
description = "Process manager for model inference backends (llama.cpp, HuggingFace)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "DamitDev" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-socketio[asyncio_client]",
    "Pebble>=5.2.1",
    "psutil>=7.2.2",
    "harbor-oci-client>=0.1.0",
    "huggingface-hub>=1.26.1",
    "docker>=7.2.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=13.610.43"]
huggingface = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
]
all = ["solar-host[nvidia,huggingface]"]
dev = ["pytest>=9.1.1"]

[project.scripts]
solar-host = "solar_host.main:run"

[project.urls]
Homepage = "https://github.com/DamitDev/solar"
Repository = "https://github.com/DamitDev/solar"
Issues = "https://github.com/DamitDev/solar/issues"

[dependency-groups]
dev = ["pytest>=9.1.1", "black>=26.5.1", "ruff>=0.16.1"]

[tool.hatch.build.targets.wheel]
packages = ["solar_host"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]

