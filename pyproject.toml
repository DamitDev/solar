[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-repository"
version = "0.0.0.dev0"
description = "API for managing model and dataset registry metadata"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.sql", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"
