[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supernova-steps"
version = "0.1.0"
description = "SuperNova training pipeline step Docker images"
requires-python = ">=3.12"

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "download-model/tests",
    "download-dataset/tests",
    "upload-model/tests",
]
