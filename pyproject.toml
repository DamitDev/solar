[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-control"
version = "0.0.0-dev"
description = "Stateless coordinator for solar-host instances with multi-tenant OpenAI-compatible API gateway"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
